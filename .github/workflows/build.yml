name: Build ULTRA IPTV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android Lint (Fehlerprüfung)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug -Dlint.abortOnError=false > lint.log 2>&1 || true
      - name: Lint-Bericht veröffentlichen (Branch lint-report)
        if: always()
        run: |
          mkdir -p /tmp/lint
          cp lint.log /tmp/lint/ 2>/dev/null || true
          find app/build/reports -name 'lint-results*' -exec cp {} /tmp/lint/ \; 2>/dev/null || true
          cd /tmp/lint
          git init -q
          git checkout -q -b lint-report
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Lint run ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lint-report

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
      ULTRA_KEYSTORE_B64: ${{ secrets.ULTRA_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Optional – eigener Signierschlüssel aus Secrets
        if: env.ULTRA_KEYSTORE_B64 != ''
        run: |
          echo "$ULTRA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ULTRA_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "ULTRA_KEYSTORE_PASSWORD=${{ secrets.ULTRA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ULTRA_KEY_ALIAS=${{ secrets.ULTRA_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ULTRA_KEY_PASSWORD=${{ secrets.ULTRA_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      # Eigener Software-Tondecoder: FFmpeg nur mit LGPL-Bausteinen (Audio-Decoder), einmal bauen und zwischenspeichern
      - name: FFmpeg-Zwischenspeicher
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg/src/main/jni/ffmpeg
          key: ffmpeg-6.0-lgpl-audio-ndk27-v1-${{ hashFiles('ffmpeg/src/main/jni/build_ffmpeg.sh') }}

      - name: NDK und CMake bereitstellen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.0.12077973" "cmake;3.22.1" > /dev/null || true
          ls "$ANDROID_HOME/ndk"

      - name: FFmpeg bauen (nur Ton-Decoder, LGPL) – nur wenn nicht zwischengespeichert
        if: steps.ffcache.outputs.cache-hit != 'true'
        run: |
          rm -rf ffmpeg/src/main/jni/ffmpeg
          git clone -q --depth 1 --branch release/6.0 https://github.com/FFmpeg/FFmpeg.git ffmpeg/src/main/jni/ffmpeg
          ffmpeg/src/main/jni/build_ffmpeg.sh "$PWD/ffmpeg/src/main" "$ANDROID_HOME/ndk/27.0.12077973" linux-x86_64 25 \
            ac3 eac3 dca truehd mlp flac alac opus vorbis mp3 mp2 pcm_mulaw pcm_alaw > ffmpeg-build.log 2>&1 || { tail -60 ffmpeg-build.log; exit 1; }
          ls -la ffmpeg/src/main/jni/ffmpeg/android-libs/*

      # Browser-Werbeblocker: aktuelle Filterlisten mitliefern (die App aktualisiert sie danach selbst)
      - name: Filterlisten für den Browser laden
        run: |
          mkdir -p app/src/main/assets/adblock
          get() { for u in "${@:2}"; do curl -fsSL --max-time 60 "$u" -o "app/src/main/assets/adblock/$1.txt" && [ "$(wc -c < app/src/main/assets/adblock/$1.txt)" -gt 2000 ] && return 0; done; rm -f "app/src/main/assets/adblock/$1.txt"; echo "::warning::$1 nicht geladen"; }
          get easylist https://easylist.to/easylist/easylist.txt https://easylist-downloads.adblockplus.org/easylist.txt
          get easyprivacy https://easylist.to/easylist/easyprivacy.txt https://easylist-downloads.adblockplus.org/easyprivacy.txt
          get easylistgermany https://easylist.to/easylistgermany/easylistgermany.txt https://easylist-downloads.adblockplus.org/easylistgermany.txt
          get urlhaus https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-agh-online.txt https://curbengh.github.io/malware-filter/urlhaus-filter-agh-online.txt https://cdn.jsdelivr.net/gh/curbengh/urlhaus-filter/urlhaus-filter-agh-online.txt
          # Schadsoftware-Liste: nur ganze Domains mitliefern (Pfad-Einträge machen sie riesig)
          if [ -f app/src/main/assets/adblock/urlhaus.txt ]; then
            { grep -E '^(!|\[)' app/src/main/assets/adblock/urlhaus.txt | head -20; grep -E '^\|\|[A-Za-z0-9.-]+\^(\$.*)?$' app/src/main/assets/adblock/urlhaus.txt || true; } > /tmp/uh.txt
            mv /tmp/uh.txt app/src/main/assets/adblock/urlhaus.txt
          fi
          ls -la app/src/main/assets/adblock

      - name: APKs bauen (Debug + Release)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee -a build.log

      - name: Unit-Tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log

      - name: Build-Log bei Fehler veröffentlichen (Branch ci-logs)
        if: failure()
        run: |
          mkdir -p /tmp/logs
          cp build.log /tmp/logs/ 2>/dev/null || true
          cp test.log /tmp/logs/ 2>/dev/null || true
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          grep -E "^e: |error:|FAILED|What went wrong" -A4 /tmp/logs/*.log > /tmp/logs/errors.txt 2>/dev/null || true
          cd /tmp/logs
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

      - name: APKs einsammeln
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/UltraIPTV.apk
          cp app/build/outputs/apk/debug/app-debug.apk out/UltraIPTV-debug.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: UltraIPTV-apks
          path: out/*.apk

  # Echter Android-Emulator (TV-Auflösung 1080p): App mit Testquelle starten, alle Seiten per
  # Fernbedienungstasten bedienen, Sender/Filme abspielen – Abstürze und Hänger lassen den Test scheitern.
  ui-test:
    # Standardmäßig übersprungen (schnellere Releases). Nur mit „[ui]“ in der Commit-Nachricht läuft der Oberflächentest.
    # [ui] = alle Oberflächentests; [ui:testName] = nur dieser eine Test (schneller); [ui:Klasse#test] = Test einer anderen Klasse
    if: ${{ contains(github.event.head_commit.message, '[ui]') || contains(github.event.head_commit.message, '[ui:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      COMMIT_MSG: ${{ github.event.head_commit.message }}
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Teststreams für die Zapping-Messung erzeugen (ffmpeg)
        run: |
          command -v ffmpeg >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; }
          d=app/src/androidTest/assets/zap; mkdir -p $d
          for g in 1 4; do
            ffmpeg -loglevel error -y -f lavfi -i testsrc2=size=1280x720:rate=25 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 40 \
              -c:v libx264 -preset veryfast -profile:v main -pix_fmt yuv420p -b:v 3000k -maxrate 3000k -bufsize 3000k \
              -g $((25*g)) -keyint_min $((25*g)) -sc_threshold 0 -c:a aac -b:a 128k -f mpegts $d/gop$g.ts
          done
          ls -la $d
      - name: Test-APKs vorbereiten
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Oberflächentest im Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: f=$(printf '%s' "$COMMIT_MSG" | grep -o '\[ui:[A-Za-z0-9_#]*\]' | head -1 | sed 's/\[ui:\(.*\)\]/\1/'); arg=""; c="UiSmokeTest#$f"; case "$f" in *#*) c="$f";; esac; [ -n "$f" ] && arg="-Pandroid.testInstrumentationRunnerArguments.class=de.ostlertekker.ultraiptv.$c"; timeout 3000 ./gradlew --no-daemon connectedDebugAndroidTest $arg > uitest.log 2>&1; r=$?; mkdir -p shots; adb pull /data/local/tmp/shots shots || true; adb logcat -d > logcat.txt; grep -E 'Tests? |tests completed|FAILED|BUILD' uitest.log | tail -15; exit $r
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-report
          path: |
            shots/
            uitest.log
            logcat.txt
            app/build/outputs/androidTest-results/
      - name: UI-Bericht veröffentlichen (Branch ui-report)
        if: always()
        run: |
          mkdir -p /tmp/rep
          cp -r shots /tmp/rep/ 2>/dev/null || true
          cp uitest.log /tmp/rep/ 2>/dev/null || true
          grep -E "FATAL|AndroidRuntime|ANR in" -A25 logcat.txt > /tmp/rep/crashes.txt 2>/dev/null || true
          grep -E "UiSmoke|TestRunner|ultraiptv|UltraZap" logcat.txt | tail -400 > /tmp/rep/steps.txt 2>/dev/null || true
          grep "UiPerf" logcat.txt | sed 's/.*UiPerf *: //' > /tmp/rep/perf.txt 2>/dev/null || true
          grep -E "Jellyfin|jellyfin" logcat.txt | tail -300 > /tmp/rep/jellyfin.txt 2>/dev/null || true
          find app/build/outputs/androidTest-results -name '*.xml' -exec cp {} /tmp/rep/ \; 2>/dev/null || true
          cd /tmp/rep
          git init -q
          git checkout -q -b ui-report
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "UI report run ${{ github.run_number }}" || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-report
      - name: UI-Test-Log bei Fehler veröffentlichen (Branch ci-logs)
        if: failure()
        run: |
          mkdir -p /tmp/logs
          cp uitest.log logcat.txt /tmp/logs/ 2>/dev/null || true
          find app/build/outputs/androidTest-results -name '*.xml' -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          grep -E "FATAL|AndroidRuntime|ANR in|Hänger|hängt|Absturz" -A30 /tmp/logs/logcat.txt > /tmp/logs/crashes.txt 2>/dev/null || true
          cd /tmp/logs
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "UI test log run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs

  system-updates:
    # Signiertes System-Update-Manifest neu bauen und auf den Zweig „system-updates“ veröffentlichen (nur wenn sich system-updates/ ändert).
    # Signiert wird mit dem Secret SYSTEM_UPDATE_SIGNING_KEY (privater Schlüssel, PKCS#8-PEM). Ohne Secret wird nichts veröffentlicht.
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Manifest bauen, signieren, veröffentlichen
        env:
          KEY: ${{ secrets.SYSTEM_UPDATE_SIGNING_KEY }}
        run: |
          if ! git diff --name-only HEAD~1 HEAD | grep -q '^system-updates/'; then echo "system-updates/ unverändert – nichts zu tun"; exit 0; fi
          if [ -z "$KEY" ]; then echo "::warning::Secret SYSTEM_UPDATE_SIGNING_KEY fehlt – Manifest wird nicht veröffentlicht"; exit 0; fi
          printf '%s\n' "$KEY" > /tmp/key.pem
          python3 .github/scripts/build-system-manifest.py system-updates out https://raw.githubusercontent.com/${{ github.repository }}/system-updates
          openssl dgst -sha256 -sign /tmp/key.pem -out /tmp/sig.der out/system-manifest.json
          base64 -w0 /tmp/sig.der > out/system-manifest.json.sig
          rm -f /tmp/key.pem /tmp/sig.der
          cd out && git init -q && git checkout -q -b system-updates && git add . \
            && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "System-Manifest ${{ github.sha }}" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" system-updates

  release:
    needs: [build, ui-test]
    if: ${{ always() && needs.build.result == 'success' && (needs.ui-test.result == 'success' || needs.ui-test.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: UltraIPTV-apks
          path: out
      - name: GitHub Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: ULTRA IPTV 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            OSTLERTEKKER PRESENTS – ULTRA IPTV
            Automatisch geprüft: Build, Unit-Tests und Oberflächentest im Android-Emulator.

            Installation auf Fire TV: App „Downloader“ öffnen und diese Adresse eingeben:
            https://github.com/${{ github.repository }}/releases/latest/download/UltraIPTV.apk
          files: |
            out/UltraIPTV.apk
            out/UltraIPTV-debug.apk
